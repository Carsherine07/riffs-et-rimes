<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur d'Accords Guitare - Riffs & Rimes</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Intégration PWA et iOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Riffs&Rimes">
    <link rel="apple-touch-icon" href="icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #000000;
            border-bottom: 1px solid #1e293b;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .titre-or {
            background: linear-gradient(to right, #fef08a, #ffd700, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            margin: 0;
            font-size: 1.5rem;
        }

        main {
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            background-color: #0a0a0a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 150px;
        }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            font-weight: 600;
        }

        select {
            background-color: #000000;
            border: 1px solid #1e293b;
            color: #ffd700;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        select:focus {
            border-color: #ffd700;
            box-shadow: 0 0 0 1px #ffd700;
        }

        .btn-play {
            background: linear-gradient(to right, #ffd700, #b8860b);
            color: #000000;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 44px;
            min-width: 200px;
        }
        
        .btn-play:hover {
            background: linear-gradient(to right, #fef08a, #ffd700);
            transform: scale(1.02);
        }

        .guitar-wrapper {
            padding: 20px 20px 20px 40px;
            background-color: #0a0a0a;
            border-radius: 8px;
            border: 1px solid #1e293b;
            overflow-x: auto;
        }

        .fretboard {
            position: relative;
            min-width: 800px;
            height: 180px;
            background-color: #0f172a;
            border-left: 10px solid #cbd5e1;
            border-radius: 0 4px 4px 0;
            margin: 20px 0;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .string-line {
            position: absolute;
            left: 0;
            right: 0;
            background-color: #94a3b8;
            box-shadow: 0 1px 2px rgba(0,0,0,0.8);
            z-index: 1;
        }
        
        .string-line[data-string="1"] { height: 1px; background-color: #cbd5e1; }
        .string-line[data-string="2"] { height: 1.5px; background-color: #cbd5e1; }
        .string-line[data-string="3"] { height: 2px; }
        .string-line[data-string="4"] { height: 2.5px; }
        .string-line[data-string="5"] { height: 3px; }
        .string-line[data-string="6"] { height: 4px; }

        .fret-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(to right, #64748b, #cbd5e1, #64748b);
            z-index: 0;
        }

        .fret-marker {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #334155;
            border-radius: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .fret-marker-double-1 { top: 30%; }
        .fret-marker-double-2 { top: 70%; }

        .nut-indicators {
            position: absolute;
            left: -35px;
            top: 0;
            bottom: 0;
            width: 30px;
        }

        .nut-marker {
            position: absolute;
            width: 100%;
            text-align: right;
            transform: translateY(-50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        
        .nut-marker.playable:hover {
            color: #ffffff !important;
            transform: translateY(-50%) scale(1.3);
        }

        .finger-dot {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fef08a, #ffd700, #b8860b);
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4), 0 2px 4px rgba(0,0,0,0.8);
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        .finger-dot:hover {
            transform: translate(-50%, -50%) scale(1.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        .finger-dot.root {
            background: linear-gradient(135deg, #ffffff, #e2e8f0, #94a3b8);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4), 0 2px 4px rgba(0,0,0,0.8);
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            transition: color 0.2s;
        }
        .back-link:hover { color: #ffd700; }
        
        .tuning-labels {
            position: absolute;
            left: -60px;
            top: 0;
            bottom: 0;
            width: 20px;
        }
        .tuning-label {
            position: absolute;
            transform: translateY(-50%);
            font-size: 0.75rem;
            color: #475569;
            font-family: 'JetBrains Mono', monospace;
        }

        .fret-number {
            position: absolute;
            bottom: -28px;
            transform: translateX(-50%);
            color: #475569;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .controls { flex-direction: column; align-items: stretch; }
            .btn-play { margin-top: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <i class="fas fa-guitar" style="color: #ffd700; font-size: 1.5rem;"></i>
        <h1 class="titre-or">Dictionnaire d'Accords</h1>
    </header>

    <main>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour à l'accueil</a>

        <section class="controls">
            <!-- NOUVEAU : Choix de l'instrument pour l'Audio -->
            <div class="input-group">
                <label for="selectGuitarType">Instrument</label>
                <select id="selectGuitarType">
                    <option value="acoustique">Guitare Acoustique</option>
                    <option value="classique">Guitare Classique (Nylon)</option>
                    <option value="electrique">Guitare Électrique</option>
                </select>
            </div>

            <div class="input-group">
                <label for="rootNote">Note Fondamentale</label>
                <select id="rootNote">
                    <option value="0">Do (C)</option>
                    <option value="1">Do# / Réb (C#)</option>
                    <option value="2">Ré (D)</option>
                    <option value="3">Ré# / Mib (D#)</option>
                    <option value="4" selected>Mi (E)</option>
                    <option value="5">Fa (F)</option>
                    <option value="6">Fa# / Solb (F#)</option>
                    <option value="7">Sol (G)</option>
                    <option value="8">Sol# / Lab (G#)</option>
                    <option value="9">La (A)</option>
                    <option value="10">La# / Sib (A#)</option>
                    <option value="11">Si (B)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="chordType">Type d'accord</label>
                <select id="chordType">
                    <optgroup label="Triades de base">
                        <option value="major">Majeur</option>
                        <option value="minor" selected>Mineur (m)</option>
                        <option value="dim">Diminué (dim)</option>
                        <option value="aug">Augmenté (aug)</option>
                    </optgroup>
                    <optgroup label="Accords Suspendus">
                        <option value="sus2">Sus 2</option>
                        <option value="sus4">Sus 4</option>
                    </optgroup>
                    <optgroup label="Accords de Septième">
                        <option value="dom7">Septième de Dominante (7)</option>
                        <option value="min7">Mineur 7 (m7)</option>
                        <option value="maj7">Majeur 7 (M7 / Maj7)</option>
                        <option value="dim7">Diminué 7 (dim7)</option>
                        <option value="m7b5">Demi-diminué (m7b5)</option>
                    </optgroup>
                    <optgroup label="Extensions (9, 11, 13)">
                        <option value="add9">Add 9 (add9)</option>
                        <option value="madd9">Mineur Add 9 (m add9)</option>
                        <option value="dom9">Neuvième (9)</option>
                        <option value="maj9">Majeur 9 (Maj9)</option>
                    </optgroup>
                </select>
            </div>

            <!-- NOUVEAU : Bouton pour jouer l'accord -->
            <button id="playChordBtn" class="btn-play">
                <i class="fas fa-volume-up"></i> Jouer l'accord
            </button>
        </section>

        <!-- VISUALISEUR MANCHE -->
        <div class="guitar-wrapper">
            <div class="fretboard" id="fretboard">
                <!-- Généré en JS : Cordes, Frettes, Repères, et Doigtés -->
            </div>
        </div>

    </main>

    <script>
        // ==========================================
        // 1. MOTEUR AUDIO (WEB AUDIO API)
        // ==========================================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        const soundCache = {}; 
        
        // Gamme chromatique (avec bémols selon le nom de tes fichiers)
        const noteNames = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

        // Convertit la Corde + la Case en nom de fichier (ex: C4)
        function getNoteNom(numeroCorde, caseFrette) {
            const cordesAVide = [52, 47, 43, 38, 33, 28]; // Mi aigu(1) à Mi grave(6)
            const noteAbsolue = cordesAVide[numeroCorde - 1] + parseInt(caseFrette);
            const octave = Math.floor(noteAbsolue / 12);
            const nomDeLaNote = noteNames[noteAbsolue % 12];
            return `${nomDeLaNote}${octave}`; 
        }

        // Joue une note unique
        function jouerNote(numeroCorde, caseFrette) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const dossierGuitare = document.getElementById('selectGuitarType').value; 
            const nomFichier = getNoteNom(numeroCorde, caseFrette);
            const url = `sons/${dossierGuitare}/${nomFichier}.mp3`;

            if (soundCache[url]) {
                lancerBuffer(soundCache[url]);
                return;
            }

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error(`Fichier introuvable: ${url}`);
                    return response.arrayBuffer();
                })
                .then(data => audioCtx.decodeAudioData(data))
                .then(buffer => {
                    soundCache[url] = buffer;
                    lancerBuffer(buffer);
                })
                .catch(err => console.warn(err));
        }

        function lancerBuffer(buffer) {
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);
        }

        // Joue tout l'accord d'un coup (comme un coup de médiator)
        function jouerAccord() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const root = parseInt(rootSelect.value);
            const type = chordSelect.value;
            const voicing = getChordVoicing(root, type); 

            let delay = 0;
            // On parcourt de la 6ème corde (i=0) à la 1ère corde (i=5)
            for(let i = 0; i <= 5; i++) {
                const fret = voicing[i];
                if(fret !== 'x') {
                    const stringNum = 6 - i; 
                    // setTimeout crée l'effet "gratté" en décalant chaque corde de 40ms
                    setTimeout(() => {
                        jouerNote(stringNum, fret);
                    }, delay);
                    delay += 40; 
                }
            }
        }

        document.getElementById('playChordBtn').addEventListener('click', jouerAccord);


        // ==========================================
        // 2. DICTIONNAIRE D'ACCORDS ET MANCHE
        // ==========================================
        const barreShapes = {
            'E': {
                'major': [0, 2, 2, 1, 0, 0],
                'minor': [0, 2, 2, 0, 0, 0],
                'dom7':  [0, 2, 0, 1, 0, 0],
                'min7':  [0, 2, 0, 0, 0, 0],
                'maj7':  [0, 2, 1, 1, 0, 0], 
                'dim':   ['x', 'x', 2, 3, 2, 3], 
                'aug':   [0, 3, 2, 1, 1, 0], 
                'sus2':  [0, 2, 4, 4, 0, 0], 
                'sus4':  [0, 2, 2, 2, 0, 0], 
                'add9':  [0, 2, 4, 1, 0, 0],
                'madd9': [0, 2, 4, 0, 0, 0],
                'm7b5':  [0, 'x', 0, 0, 1, 'x'],
                'dim7':  [0, 'x', -1, 0, -1, 'x'],
                'dom9':  [0, 2, 0, 1, 0, 2],
                'maj9':  [0, 2, 1, 1, 0, 2]
            },
            'A': {
                'major': ['x', 0, 2, 2, 2, 0],
                'minor': ['x', 0, 2, 2, 1, 0],
                'dom7':  ['x', 0, 2, 0, 2, 0],
                'min7':  ['x', 0, 2, 0, 1, 0],
                'maj7':  ['x', 0, 2, 1, 2, 0],
                'dim':   ['x', 0, 1, 2, 1, 'x'], 
                'aug':   ['x', 0, 3, 2, 2, 'x'], 
                'sus2':  ['x', 0, 2, 2, 0, 0],
                'sus4':  ['x', 0, 2, 2, 3, 0],
                'add9':  ['x', 0, 2, 4, 2, 0],
                'madd9': ['x', 0, 2, 4, 1, 0],
                'm7b5':  ['x', 0, 1, 0, 1, 'x'],
                'dim7':  ['x', 0, 1, 2, 1, 'x'],
                'dom9':  ['x', 0, 2, 0, 2, 0],
                'maj9':  ['x', 0, 2, 1, 0, 0]
            }
        };

        const customOpenShapes = {
            '0-major': ['x', 3, 2, 0, 1, 0], 
            '0-dom7':  ['x', 3, 2, 3, 1, 0], 
            '0-maj7':  ['x', 3, 2, 0, 0, 0], 
            '0-add9':  ['x', 3, 2, 0, 3, 0], 
            '7-major': [3, 2, 0, 0, 0, 3],   
            '7-dom7':  [3, 2, 0, 0, 0, 1],   
            '7-maj7':  [3, 2, 0, 0, 0, 2],   
            '7-sus4':  [3, 3, 0, 0, 1, 3],   
            '7-add9':  [3, 2, 0, 2, 0, 3],   
            '2-major': ['x', 'x', 0, 2, 3, 2], 
            '2-minor': ['x', 'x', 0, 2, 3, 1], 
            '2-dom7':  ['x', 'x', 0, 2, 1, 2], 
            '2-min7':  ['x', 'x', 0, 2, 1, 1], 
            '2-maj7':  ['x', 'x', 0, 2, 2, 2], 
            '2-sus2':  ['x', 'x', 0, 2, 3, 0], 
            '2-sus4':  ['x', 'x', 0, 2, 3, 3]  
        };

        function getChordVoicing(root, type) {
            const customKey = `${root}-${type}`;
            if (customOpenShapes[customKey]) return customOpenShapes[customKey];

            let shapeFamily, offset;
            
            if (['dim', 'aug', 'dim7'].includes(type)) {
                shapeFamily = 'A';
                offset = root >= 9 ? root - 9 : root + 3;
            } 
            else if ([4, 5, 6, 7, 8].includes(root)) {
                shapeFamily = 'E';
                offset = root - 4;
            } 
            else {
                shapeFamily = 'A';
                offset = root >= 9 ? root - 9 : root + 3;
            }

            if (root === 4 && type === 'm7b5') {
                shapeFamily = 'A'; offset = 7;
            }

            const baseShape = barreShapes[shapeFamily][type];
            return baseShape.map(fret => {
                if (fret === 'x') return 'x';
                const calculatedFret = fret + offset;
                return calculatedFret < 0 ? 'x' : calculatedFret;
            });
        }

        const fretboard = document.getElementById('fretboard');
        const rootSelect = document.getElementById('rootNote');
        const chordSelect = document.getElementById('chordType');
        const numFrets = 15;
        const stringNotes = ['E', 'A', 'D', 'G', 'B', 'e']; 

        function buildFretboardBackground() {
            fretboard.innerHTML = '';

            const tuningLabels = document.createElement('div');
            tuningLabels.className = 'tuning-labels';

            for (let i = 1; i <= 6; i++) {
                const stringPos = ((i - 1) * 20); 
                
                const stringLine = document.createElement('div');
                stringLine.className = 'string-line';
                stringLine.dataset.string = 7 - i; 
                stringLine.style.top = `${stringPos}%`;
                fretboard.appendChild(stringLine);

                const label = document.createElement('div');
                label.className = 'tuning-label';
                label.innerText = stringNotes[6 - i];
                label.style.top = `${stringPos}%`;
                tuningLabels.appendChild(label);
            }

            for (let f = 1; f <= numFrets; f++) {
                const fretPos = (f / numFrets) * 100;
                const fretLine = document.createElement('div');
                fretLine.className = 'fret-line';
                fretLine.style.left = `${fretPos}%`;
                fretboard.appendChild(fretLine);

                // Correction de l'alignement des points et numéros (f - 0.5)
                if ([3, 5, 7, 9, 15].includes(f)) {
                    const marker = document.createElement('div');
                    marker.className = 'fret-marker';
                    marker.style.left = `${(f - 0.5) * (100 / numFrets)}%`;
                    fretboard.appendChild(marker);
                } else if (f === 12) {
                    const marker1 = document.createElement('div');
                    marker1.className = 'fret-marker fret-marker-double-1';
                    marker1.style.left = `${(f - 0.5) * (100 / numFrets)}%`;
                    fretboard.appendChild(marker1);
                    
                    const marker2 = document.createElement('div');
                    marker2.className = 'fret-marker fret-marker-double-2';
                    marker2.style.left = `${(f - 0.5) * (100 / numFrets)}%`;
                    fretboard.appendChild(marker2);
                }

                if (f % 2 !== 0) {
                    const fretNum = document.createElement('div');
                    fretNum.className = 'fret-number';
                    fretNum.style.left = `${(f - 0.5) * (100 / numFrets)}%`;
                    fretNum.innerText = f;
                    fretboard.appendChild(fretNum);
                }
            }

            const nutContainer = document.createElement('div');
            nutContainer.className = 'nut-indicators';
            nutContainer.id = 'nut-indicators';
            fretboard.appendChild(nutContainer);

            const fingersContainer = document.createElement('div');
            fingersContainer.id = 'fingers';
            fretboard.appendChild(fingersContainer);
        }

        function updateVoicingDisplay() {
            const root = parseInt(rootSelect.value);
            const type = chordSelect.value;
            const voicing = getChordVoicing(root, type); 

            const fingersContainer = document.getElementById('fingers');
            const nutContainer = document.getElementById('nut-indicators');
            
            fingersContainer.innerHTML = '';
            nutContainer.innerHTML = '';

            const fretWidth = 100 / numFrets;
            const rootNotesValue = [4, 9, 2, 7, 11, 4]; 

            for(let i = 5; i >= 0; i--) {
                const fret = voicing[i];
                const stringPosPercent = ((5 - i) * 20); 
                const stringNum = 6 - i; // Calcul du numéro de corde (1=Aiguë, 6=Grave)

                const indicator = document.createElement('div');
                indicator.className = 'nut-marker';
                indicator.style.top = `${stringPosPercent}%`;
                
                if (fret === 'x') {
                    indicator.innerText = 'X';
                    indicator.style.color = '#475569'; 
                } else if (fret === 0) {
                    indicator.innerText = 'O';
                    indicator.style.color = '#ffd700'; 
                    indicator.classList.add('titre-or', 'playable'); 
                    indicator.title = "Écouter la corde à vide";
                    // Déclenche l'audio au clic
                    indicator.onclick = () => jouerNote(stringNum, 0);
                    indicator.style.cursor = 'pointer';
                }
                nutContainer.appendChild(indicator);

                if (fret !== 'x' && fret > 0) {
                    const dot = document.createElement('div');
                    dot.className = 'finger-dot';
                    
                    const leftPos = (fret - 0.5) * fretWidth;
                    dot.style.left = `${leftPos}%`;
                    dot.style.top = `${stringPosPercent}%`;
                    
                    const currentNote = (rootNotesValue[i] + fret) % 12;
                    if (currentNote === root) {
                        dot.classList.add('root');
                    }
                    
                    dot.title = "Écouter la note";
                    // Déclenche l'audio au clic
                    dot.onclick = () => jouerNote(stringNum, fret);
                    
                    fingersContainer.appendChild(dot);
                }
            }
        }

        // ==========================================
        // 3. SAUVEGARDE ET INITIALISATION
        // ==========================================
        
        // On construit le fond du manche (cordes, frettes...)
        buildFretboardBackground();
        
        // Clé de sauvegarde unique pour la guitare
        const GUITAR_STORAGE_KEY = 'riffs_rimes_guitare_state';

        // Fonction pour mémoriser les choix dans le téléphone
        function saveGuitarState() {
            const state = {
                instrument: document.getElementById('selectGuitarType').value,
                root: rootSelect.value,
                type: chordSelect.value
            };
            localStorage.setItem(GUITAR_STORAGE_KEY, JSON.stringify(state));
        }

        // Fonction pour recharger les choix au lancement de la page
        function loadGuitarState() {
            const savedState = localStorage.getItem(GUITAR_STORAGE_KEY);
            if (savedState) {
                try {
                    const state = JSON.parse(savedState);
                    if (state.instrument) document.getElementById('selectGuitarType').value = state.instrument;
                    if (state.root) rootSelect.value = state.root;
                    if (state.type) chordSelect.value = state.type;
                } catch (e) {
                    console.error("Erreur de chargement", e);
                }
            }
            // Une fois les menus mis à jour, on dessine l'accord correspondant
            updateVoicingDisplay();
        }

        // Au démarrage : on charge les données au lieu de juste afficher le Mi mineur
        loadGuitarState();

        // Écouteurs d'événements : on met à jour le visuel ET on sauvegarde à chaque clic
        rootSelect.addEventListener('change', () => {
            updateVoicingDisplay();
            saveGuitarState();
        });
        
        chordSelect.addEventListener('change', () => {
            updateVoicingDisplay();
            saveGuitarState();
        });
        
        document.getElementById('selectGuitarType').addEventListener('change', () => {
            // Pas besoin de redessiner l'accord si on change juste le son, mais on sauvegarde
            saveGuitarState();
        });

    </script>
</body>
</html>
